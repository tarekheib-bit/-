[mcp_servers.cloudinary-asset-mgmt]
command = "npx"
args = [
    "-y",
    "--registry",
    "https://registry.npmjs.org",
    "--package",
    "@cloudinary/asset-management",
    "--",
    "mcp",
    "start",
    "--transport",
    "stdio",
]
env_vars = ["CLOUDINARY_URL"]

[mcp_servers.cloudinary-env-config]
command = "npx"
args = [
    "-y",
    "--registry",
    "https://registry.npmjs.org",
    "--package",
    "@cloudinary/environment-config",
    "--",
    "mcp",
    "start",
    "--transport",
    "stdio",
]
env_vars = [
    "CLOUDINARY_CLOUD_NAME",
    "CLOUDINARY_API_KEY",
    "CLOUDINARY_API_SECRET",
]
